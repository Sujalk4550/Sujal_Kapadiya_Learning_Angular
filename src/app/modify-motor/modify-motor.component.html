
<form [formGroup]="motorcycleForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" [appHighlightOnFocus]="'green'" />
  </div>

  <div class="form-group">
    <label for="brand">BRAND</label>
    <input type="text" id="brand" formControlName="brand" [appHighlightOnFocus]="'green'"/>
  </div>

  <div class="form-group">
    <label for="date">DATE</label>
    <input type="date" id="date" formControlName="date"[appHighlightOnFocus]="'green'" />
  </div>

  <div class="form-group">
    <label for="name">NAME</label>
    <input type="text" id="name" formControlName="name" [appHighlightOnFocus]="'green'"/>
  </div>

  <div class="form-group">
    <label for="colour">COLOUR</label>
    <input type="text" id="colour" formControlName="colour"[appHighlightOnFocus]="'green'" />
  </div>

  <div class="form-group">
    <label for="bikeType">BIKE TYPE</label>
    <input type="text" id="bikeType" formControlName="bikeType"[appHighlightOnFocus]="'green'" />
  </div>

  <div class="form-group">
    <label for="petrol">PETROL</label>
    <input type="checkbox" id="petrol" formControlName="petrol" />
  </div>


  <button type="submit">Submit</button>


</form>
<div *ngIf="error" class="error">{{ error }}</div>
